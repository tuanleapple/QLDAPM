services:
  postgres:
    image: postgres:16-alpine
    container_name: internship-management-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-internship_management_dev}
      POSTGRES_USER: ${DATABASE_USER:-internship_app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me}
    ports:
      - '${DATABASE_PORT:-5433}:5432'
    volumes:
      - internship_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  internship_postgres_data:
